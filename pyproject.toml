[project]
name = "jk-bro-miniproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.0",
    "Flask-Cors==5.0.0",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "onnxruntime==1.20.1",
]

[tool.uv]
# On PCs with Windows Smart App Control on, unsigned Python builds (including the ones uv downloads)
# and their venv launchers are blocked. Use the signed python.org interpreter so `uv run` works.
python-preference = "only-system"
